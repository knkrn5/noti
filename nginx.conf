worker_processes auto;
user www-data;

events {
	worker_connections 1024;
}


http {

	include mime.types;

	sendfile on;

	error_page 404 /404.html;

	server {
		# root /var/www/html;
		root /var/www/web;

		autoindex on;

		location =  /about {
			return 200 'About me';
		}

		location /readme {
			try_files /readme.html =404;	
		}

		location /contact/ {
			index /contact.html;
		}

		# location / {
		# 	error_page 404 /404.html;
		# }
	}

	server {
		listen 8080;
		root /var/www/html;
		index index.nginx-debian.html;
	}
}
